services:
  nginx:
    build:
      context: ./nginx
    container_name: megaton_nginx
    ports:
      - "8081:80"
    depends_on:
      - phpfpm
    volumes:
      - ./magento2:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - megaton

  phpfpm:
    build:
      context: ./magento2
    container_name: megaton_php
    depends_on:
      - db
      - search
      - rabbitmq
      - valkey
      - newrelic
    volumes:
      - ./magento2:/var/www/html:cached
    environment:
      APP_DIR: /var/www/html
      MAGENTO_BASE_URL: http://localhost:8081/
      MAGENTO_PUBLIC_KEY: ${MAGENTO_PUBLIC_KEY:-}
      MAGENTO_PRIVATE_KEY: ${MAGENTO_PRIVATE_KEY:-}
      MAGENTO_DB_HOST: db
      MAGENTO_DB_NAME: magento
      MAGENTO_DB_USER: magento
      MAGENTO_DB_PASSWORD: magento123
      MAGENTO_SEARCH_ENGINE: opensearch
      OPENSEARCH_HOST: search
      OPENSEARCH_PORT: 9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: magento
      RABBITMQ_PASSWORD: magento123
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
    networks:
      - megaton

  db:
    build:
      context: ./mariadb
    container_name: megaton_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - megaton

  search:
    build:
      context: ./opensearch
    container_name: megaton_opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-MegatonAdmin123!}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - search_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - megaton

  rabbitmq:
    build:
      context: ./rabbitmq
    container_name: megaton_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: magento
      RABBITMQ_DEFAULT_PASS: magento123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - megaton

  newrelic:
    build:
      context: ./newrelic
    container_name: megaton_newrelic
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-YOUR_NEW_RELIC_LICENSE_KEY}
    networks:
      - megaton

  valkey:
    build:
      context: ./valkey
    container_name: megaton_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - megaton

networks:
  megaton:
    driver: bridge

volumes:
  db_data:
  search_data:
  valkey_data:
